[project]
name = "md2short"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.14.0",
    "python-dotenv>=1.2.4",
    "typer>=0.27.3",
]

[project.scripts]
md2short = "md2short.cli:app"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
markers = [
    "slow: spawns a real `npx remotion render` subprocess (tens of seconds)",
]
